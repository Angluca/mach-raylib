[project]
id = "raylib"
version = "0.1.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[artifact.raylib]
kind = "bin"
entry = "main.mach"
out = "bin/main"
targets = ["*"]
#subsystem = "gui"
link = [
    #"raygui",
    "raylib",
    # -- os: linux ----
    "pthread", "m", "dl", "rt",
    # -- os: windows ----
    # -- os: darwin ----
    "libSystem", "objc",
    "Cocoa", "AppKit", "Foundation", "CoreGraphics", "CoreServices",
    "IOKit", "CoreFoundation", "CoreVideo", "OpenGL",
]
need = []

[profile.debug]
opt = 0
debug = true
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[link.raylib]
source = "system"
#name = "libs/libraylib.a"
name = "raylib" # mach build . -L lib_path
os = ["linux", "windows", "darwin"]
isa = "*"
abi = "*"
export = true

#[link.raygui]
#source = "system"
##name = "libs/libraygui.a"
#name = "raygui"
#os = ["linux", "windows", "darwin"]
#isa = "*"
#abi = "*"
#export = true

[link.libSystem]
source = "system"
name = "/usr/lib/libSystem.B.dylib"
library = "libSystem"
symbols = [
    "_NSConcreteGlobalBlock", "_NSGetExecutablePath", "_NSGetProgname", 
    "___chkstk_darwin", "__bzero", "__error", "__exp10", 
    "__memcpy_chk", "__memset_chk", "__sincos_stret", 
    "__sincosf_stret", "__sprintf_chk", "__stack_chk_fail", 
    "__stack_chk_guard", "__stderrp", "__stdoutp", "__strcat_chk", 
    "__strncpy_chk", "access", "acos", "acosf", "asinf", "atan2f", 
    "atof", "atoi", "atoll", "calloc", "chdir", "closedir", "cos", 
    "cosf", "div", "dlclose", "dlopen", "dlsym", "exit", "exp", 
    "exp2f", "fclose", "feof", "ferror", "fflush", "fgetc", "fgets", 
    "fileno", "fmod", "fmodf", "fopen", "fprintf", "fread", "free", 
    "frexp", "fseek", "fstat$INODE64", "ftell", "fwrite", "getcwd", 
    "gettimeofday", "hypot", "hypotf", "ldexp", "log", "logf", 
    "mach_absolute_time", "mach_timebase_info", "malloc", "memchr", 
    "memcmp", "memcpy", "memmove", "memset", "memset_pattern16", 
    "mkdir", "opendir$INODE64", "pow", "powf", "pthread_attr_destroy", 
    "pthread_attr_getschedparam", "pthread_attr_init", 
    "pthread_attr_setinheritsched", "pthread_attr_setschedparam", 
    "pthread_attr_setschedpolicy", "pthread_attr_setstacksize", 
    "pthread_cond_destroy", "pthread_cond_init", "pthread_cond_signal", 
    "pthread_cond_wait", "pthread_create", "pthread_getspecific", 
    "pthread_join", "pthread_key_create", "pthread_key_delete", 
    "pthread_mutex_destroy", "pthread_mutex_init", 
    "pthread_mutex_lock", "pthread_mutex_unlock", 
    "pthread_setspecific", "puts", "qsort", "rand", "readdir$INODE64", 
    "realloc", "remove", "rename", "rewind", "sched_get_priority_max", 
    "sched_get_priority_min", "select$1050", "sin", "sinf", "snprintf", 
    "sprintf", "sscanf", "stat$INODE64", "strchr", "strcmp", "strcpy", 
    "strcspn", "strerror", "strlen", "strncmp", "strncpy", "strpbrk", 
    "strrchr", "strspn", "strstr", "strtok", "strtol", "strtoul", 
    "system", "tan", "time", "ungetc", "usleep", "vprintf", 
    "vsnprintf", "wcsrtombs", "ma_atomic_global_lock"
]
os = ["darwin"]
isa = "*"
abi = "*"
export = true

[link.objc]
